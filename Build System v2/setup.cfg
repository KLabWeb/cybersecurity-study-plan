# flake8 reads only this file; it runs wemake-python-styleguide for all code in the Build System.
# Ruff carries the E, W and F checks, so flake8 runs the wemake (WPS) checks alone.
# Limits are set at or below wemake's own defaults, never above.

[flake8]
select = WPS
max-line-length = 100
exclude = .venv,__pycache__
format = wemake
show-source = true

max-cognitive-score = 5
max-cognitive-average = 3
max-line-complexity = 10
max-local-variables = 5
max-arguments = 4
max-returns = 3
max-expressions = 7
max-module-members = 7
max-methods = 7
max-imports = 10
max-attributes = 5
max-access-level = 3
max-call-level = 2
