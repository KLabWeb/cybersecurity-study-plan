        Threat Dragon</a> for the data flow diagram. Apply STRIDE to each component""",
    """\
        <b>Produce a threat model document:</b> DFD, trust boundaries, threat enumeration, \
        risk rating, mitigations""",
    """\
        Write a <a href=\"https://www.linkedin.com\" color=\"#3A7AB8\">LinkedIn</a> article \
        from the threat model, ‘Threat Modeling a FastAPI Application with STRIDE’ \
        (1,000–1,500 words): the data flow diagram, what STRIDE identified, and the \
        mitigations chosen""",
]

[[block]]
kind = "step"
number = "03"
label = "STUDY: OWASP ASVS — Verification Standard"
time = "Week 28"
bullets = [
    """\
        Read the <a \
        href=\"https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/OWASP_Application_Security_Verification_Standard_5.0.0_en.pdf\" \
        color=\"#3A7AB8\">ASVS v5.0.0 Level 1 and Level 2 requirements</a>. Learn the \
        structure and the categories""",
    """\
        Map each ASVS chapter to the vulnerability classes studied in this plan — input \
        validation and output encoding, authentication, access control, and cryptography \
        each get their own chapter, so you can pin any finding to a specific numbered \
        requirement""",
    """\
        Build a personal ASVS checklist: 20–30 of the highest-signal Level 2 requirements \
        you would check first in a code review""",
    """\
        Read the OWASP Top 10 page for <a \
        href=\"https://owasp.org/Top10/2025/A09_2025-Security_Logging_and_Alerting_Failures/\" \
        color=\"#3A7AB8\">A09 Security Logging and Alerting Failures</a>. Then, audit the \
        Phase 0 FastAPI application against the ASVS <a \
        href=\"https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x25-V16-Security-Logging-and-Error-Handling.md\" \
        color=\"#3A7AB8\">Security Logging and Error Handling</a> chapter""",
    """\
        Write up the findings in the write-up structure from <a \
        href=\"https://tryhackme.com/room/writingpentestreports\" color=\"#3A7AB8\">Writing \
        Pentest Reports</a>, and label them A09 Security Logging and Alerting Failures""",
    """\
        Read the <a \
        href=\"https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html\" \
