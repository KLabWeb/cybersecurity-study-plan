[[block]]
kind = "subheading"
title = "Concepts and Their Use on the Job"

[[block]]
kind = "concept"
name = "The OWASP Top 10"
text = """\
    A published list of web vulnerability categories, introduced in this phase as a \
    taxonomy. SQL injection and XSS are the classes seen in practice so far. <b>On the \
    job:</b> This is shared vocabulary in code reviews and architecture conversations. When \
    a developer asks why their code is flagged, you explain which OWASP category it falls \
    into and why it matters."""

[[block]]
kind = "concept"
name = "Injection as a class"
text = """\
    Any time user input reaches an interpreter without proper sanitization, injection is \
    possible. SQL injection is one example. <b>On the job:</b> When reviewing an API \
    endpoint that accepts user input, a first question is whether the input reaches an \
    interpreter, such as a database query. This question catches vulnerabilities automated \
    tools miss."""

[[block]]
kind = "concept"
name = "The attacker’s mindset"
text = """\
    The attacker’s mindset is the shift from checking that code works as intended to \
    checking what it does with input it was not written to expect."""

[[block]]
kind = "concept"
name = "HTTP as the attack surface"
text = """\
    Web vulnerabilities are delivered over HTTP: parameters, headers, cookies, request \
    bodies, and additional parts of a request. Understanding HTTP underlies the web \
    vulnerability classes in this plan. <b>On the job:</b> Burp Suite sessions, manual web \
    tests, and DAST scan results are built from HTTP transactions. Reading raw HTTP requests \
    and responses is a routine part of the work."""

[[block]]
kind = "space"
points = 2

