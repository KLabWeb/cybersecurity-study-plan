    Phase VI builds the two highest-leverage AppSec skills — the ones that appear earliest \
    in a job. Secure code review is the daily work of most AppSec engineers at software \
    companies. Threat modeling is how AppSec influence scales beyond individual code reviews \
    to affect system design. OWASP ASVS is studied here as the verification standard that \
    gives code review a systematic checklist — turning ad-hoc review into structured, \
    repeatable methodology. Its ASVS step produces a write-up of the logging gaps in the \
    Phase 0 FastAPI application, labelled with its OWASP Top 10 category, A09 Security \
    Logging and Alerting Failures."""
