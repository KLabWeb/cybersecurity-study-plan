[[block]]
kind = "subheading"
title = "Concepts and Their Use on the Job"

[[block]]
kind = "concept"
name = "AWS Shared Responsibility Model"
text = """\
    AWS secures the physical infrastructure. You secure what runs on it: IAM configurations, \
    S3 policies, application code, data encryption. Misunderstanding this boundary is the \
    root cause of many cloud breaches."""

[[block]]
kind = "concept"
name = "IAM — Identity and Access Management"
text = """\
    Users, roles, groups, and policies. A role is what an AWS service or EC2 instance \
    assumes to perform actions. A policy is a JSON document defining what actions are \
    allowed or denied on which resources. Least privilege means a role should have exactly \
    the permissions it needs and nothing more. Over-permissioned roles are a common IAM \
    finding. <b>On the job:</b> When a team presents a new service design, you ask: what IAM \
    role does this service run as? What permissions does that role have? Could an attacker \
    compromise this service and use its IAM role to access something they should not? \
    Reading an IAM policy JSON, an S3 bucket policy, or a Lambda configuration and spotting \
    the problem is an AppSec-specific cloud skill: auditing infrastructure, not writing it."""

[[block]]
kind = "concept"
name = "S3 bucket misconfiguration"
text = """\
    Public read access means anyone on the internet can read the contents. Authenticated AWS \
    user access means any AWS account holder worldwide can read it. Both are common \
    misconfigurations. Bucket policies, ACLs, and Block Public Access settings all interact, \
    and a reviewer has to know which one controls what. <b>On the job:</b> When reviewing a \
    deployment configuration or an IaC pull request, you check: is Block Public Access \
    enabled at the bucket level? Are there wildcard permissions? Are access logs enabled on \
    buckets containing sensitive data?"""

[[block]]
kind = "concept"
name = "EC2 instance metadata service (IMDS)"
text = """\
    169.254.169.254 is accessible from within an EC2 instance and returns IAM credentials, \
    instance ID, and configuration. SSRF against this endpoint gives an attacker the \
    instance’s IAM credentials. IMDSv2 requires a token header that prevents simple SSRF \
    exploitation. Whether IMDSv2 is enforced is a standard AppSec checklist item. <b>On the \
    job:</b> When you see an endpoint that accepts a URL and fetches it server-side, your \
    first question is now: can this reach 169.254.169.254? Is IMDSv2 enforced on the EC2 \
    instances this service runs on? Is there a URL allowlist? flaws.cloud Level 5 is the \
    exact attack chain you are looking for."""

[[block]]
kind = "concept"
name = "Credential exposure in git history"
text = """\
    AWS keys committed to a git repository — even if deleted in a later commit — are \
    permanently visible in history. TruffleHog scans history. The fix is to rotate the \
    exposed credential, not just delete it from current code, plus pre-commit scanning to \
    prevent recurrence. <b>On the job:</b> When reviewing any code that configures AWS \
    clients, check: are credentials hardcoded? Are they pulled from environment variables \
    (better but still risky) or from a secrets manager or IAM role (correct)?"""

