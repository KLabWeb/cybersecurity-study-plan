[[block]]
kind = "page_break"

[[block]]
kind = "subheading"
title = "Concepts and Their Use on the Job"

[[block]]
kind = "concept"
name = "HTTP security model"
text = """\
    The HTTP headers that have security implications, what each does, and what happens when \
    it is misconfigured. <b>On the job:</b> When reviewing a PR that sets cookies or \
    configures CORS, you check HttpOnly, Secure, SameSite, and Access-Control-Allow-Origin \
    as a reflex."""

[[block]]
kind = "concept"
name = "Authentication and session security"
text = """\
    How authentication protocols work and how they fail. JWT algorithm confusion is a \
    recurring real-world finding. <b>On the job:</b> JWT configuration is an early check: \
    whether the algorithm is restricted to an allowlist, whether the signature is verified, \
    and whether the claims are validated. These checks catch common JWT vulnerabilities."""

[[block]]
kind = "concept"
name = "Access control"
text = """\
    IDOR, privilege escalation, horizontal vs. vertical access control flaws. Ranked A01 in \
    the OWASP Top 10:2025. <b>On the job:</b> When reviewing an API endpoint that returns \
    data based on a user-supplied ID, you ask: is the user’s authorization checked against \
    the requested resource, or just their authentication? This question catches many IDOR \
    flaws."""

[[block]]
kind = "concept"
name = "API security"
text = """\
    REST API-specific vulnerability patterns — broken object-level authorization (IDOR), \
    mass assignment, and excessive data exposure — and why APIs widen the attack surface \
    beyond traditional server-rendered applications."""

[[block]]
kind = "concept"
name = "Input validation"
text = """\
    The root cause of injection vulnerabilities. The injection classes share one root cause: \
    unsanitized user input reaching an interpreter."""

[[block]]
kind = "concept"
name = "Cryptography fundamentals"
text = """\
    Hashing vs. encryption vs. encoding. Which algorithms are broken (MD5, SHA-1 for \
    passwords, DES, RC4) and which are correct (bcrypt, AES-GCM, RSA). How to identify weak \
    crypto in a code review. <b>On the job:</b> When you see a password hash, you check \
    whether it is bcrypt/Argon2 (correct) or MD5/SHA-1 (flag immediately). When you see \
    encrypted data, you check for AES-GCM (correct) vs AES-ECB (flag). When you see a \
    secret, you check whether it is hardcoded or pulled from a secret manager."""

[[block]]
kind = "concept"
name = "Networking fundamentals for AppSec"
text = """\
    OSI layers 3 (Network/IP), 4 (Transport/TCP-UDP), and 7 (Application/HTTP) and why \
    AppSec lives at layer 7. TCP vs UDP and one security implication of each. The steps of a \
    URL request from DNS query to HTTP response. Common ports and the services on them. \
    Private IP ranges (10.x, 172.16–172.31.x, 192.168.x), localhost (127.0.0.1), and the AWS \
    metadata endpoint (169.254.169.254). Standard web app network architecture: internet → \
    firewall → load balancer → app server → database. What a firewall, load balancer, and \
    reverse proxy each do and what security question to ask about each. <b>On the job:</b> \
    When asked ‘where does TLS terminate?’ in an architecture review, you answer and explain \
    the security implication. When reviewing a deployment configuration, you check for \
    unexpected open ports. When a threat model shows a service making outbound HTTP calls, \
    you ask whether SSRF mitigations are in place and whether private IP ranges are blocked. \
    When a design review describes traffic from an EC2 instance to 169.254.169.254 and asks \
    if it is concerning, the answer is yes — SSRF against the metadata endpoint."""

[[block]]
kind = "concept"
name = "Networking as an attack surface"
text = """\
    DNS rebinding exploits the gap between DNS validation and the TCP connection, bypassing \
    SSRF protections. SSRF against private IP ranges and the AWS metadata endpoint \
    (169.254.169.254) is a common high-severity finding in cloud-hosted applications. Where \
    TLS terminates in an architecture tells you whether internal traffic is encrypted; HTTP \
    statelessness is why cookies exist and therefore an attack surface; and unexpected open \
    ports in a deployment configuration are a finding. These networking behaviors are what \
    AppSec engineers encounter in real work, not networking-engineering concepts."""

[[block]]
kind = "concept"
name = "AppSec program thinking (Janca)"
text = """\
    AppSec is not just finding bugs — it is building the processes, training, and SDLC \
    integration that stop bugs from being introduced. The developer’s perspective on the \
    defensive side of the role."""

