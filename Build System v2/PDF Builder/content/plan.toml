[[block]]
kind = "subheading"
title = "Concepts and Their Use on the Job"

[[block]]
kind = "concept"
name = "Injection — complete taxonomy"
text = """\
    SQL, command, template, LDAP, NoSQL. Root cause: unsanitized user input reaching an \
    interpreter. Fix: parameterized queries. <b>On the job:</b> a database query, a shell \
    command or a template render gets the same question: does user input reach this without \
    sanitization?"""

[[block]]
kind = "concept"
name = "XSS — all three types"
text = """\
    Reflected, stored, DOM. Root cause: user input rendered as HTML without encoding. Fix: \
    context-appropriate output encoding. <b>On the job:</b> React escapes JSX output by \
    default, which prevents many reflected XSS vectors. What to check in a React code \
    review: dangerouslySetInnerHTML usage (bypasses JSX escaping entirely), third-party \
    component XSS vectors, and any server-rendered template output that feeds into the React \
    tree."""

[[block]]
kind = "concept"
name = "CSRF and SSRF"
text = """\
    CSRF exploits browser trust. SSRF exploits server trust to reach internal resources. \
    Fix: SameSite cookies for CSRF; URL allowlists for SSRF. <b>On the job:</b> An endpoint \
    accepting a URL parameter gets flagged for review. Does it fetch that URL server-side? \
    Is the response returned to the user? Is there a URL allowlist? Three questions."""

[[block]]
kind = "concept"
name = "Access control flaws"
text = """\
    Ranked A01 in the OWASP Top 10:2025. Fix: verify the authenticated user is authorized \
    for the specific resource on every request."""

[[block]]
kind = "page_room"
inches = 2.6

[[block]]
kind = "concept"
name = "Business logic vulnerabilities"
text = """\
    Hard for automated tools to detect. Requires understanding intended behavior. <b>On the \
    job:</b> This is the vulnerability class that threat modeling catches before it ships. \
    STRIDE analysis of a data flow diagram surfaces the business logic assumptions that \
    could be violated."""

[[block]]
kind = "concept"
name = "Securing LLM-backed features"
text = """\
    The LLM-specific classes — prompt injection, improper output handling, excessive agency, \
    and sensitive information disclosure — sit on top of the classic vulnerability classes \
    covered in this phase: injection is injection, output handling is untrusted-input \
    handling, excessive agency is least privilege. <b>On the job:</b> An increasingly common \
    AppSec task; review an LLM-backed endpoint with the same questions you ask of any \
    endpoint that takes untrusted input and calls tools."""

[[block]]
kind = "space"
points = 2

