text = """\
    Modern AppSec work happens in the cloud. S3 misconfiguration and IAM over-permissioning \
    are among the most frequently reported cloud misconfigurations, and credible threat \
    modeling requires understanding the cloud attack surface an application runs on. This \
    phase covers the AppSec-relevant subset: how to identify misconfigurations in code and \
    architecture reviews, understand SSRF chains that target cloud metadata, and discuss \
    findings with infrastructure teams. It then goes deeper on these subjects: \
    infrastructure as code with Terraform, Kubernetes security, and Azure beside AWS. Its \
    container security step produces a write-up of the misconfigurations in the Phase 0 \
    FastAPI application’s Dockerfile and docker-compose.yaml, labelled with its OWASP Top 10 \
    category, A02 Security Misconfiguration."""
