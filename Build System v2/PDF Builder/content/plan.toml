# ════════════════════════════════════════════════════════════════════════
#  STUDY METHODOLOGY
# ════════════════════════════════════════════════════════════════════════
[[block]]
kind = "page_break"

[[block]]
kind = "heading"
title = "Study Methodology"

[[block]]
kind = "paragraph"
text = """\
    The methods below apply to every phase. Following them consistently is the difference \
    between completing labs and actually owning the material."""
style = "body"

[[block]]
kind = "subheading"
title = "Local &amp; Regional Events"

[[block]]
kind = "paragraph"
text = """\
    Studying is not only reading and labs — attending local and regional security events is \
    part of the work, because practitioners share current techniques there. A few worth \
    knowing: the OWASP Philadelphia chapter (an AppSec-specific group), Philly 2600 (meets \
    the first Friday of each month), and OWASP Global AppSec USA (city changes yearly; 2026 \
    is San Francisco). Start attending early in the plan. See the Appendix section “<a \
    href=\"#philly_appsec\" color=\"#3A7AB8\">Philadelphia AppSec Community</a>” for the \
    full list of groups and conferences."""
style = "body"

[[block]]
kind = "space"
points = 2

[[block]]
kind = "subheading"
title = "Note-Taking: Notes → Note Cards"

[[block]]
kind = "paragraph"
text = """\
    Two outputs for every chapter or lab section: working notes during study, note cards \
    derived from them afterward. Notes are for comprehension; note cards are for retention."""
style = "body"

[[block]]
kind = "bullet"
text = """\
    <b>During study:</b> Detailed working notes in your own words. For security concepts: \
    what the vulnerability is, why the code is exploitable, how an attacker uses it, how to \
    fix it. Questions you cannot answer yet."""

[[block]]
kind = "bullet"
text = """\
    <b>After each section:</b> Extract note cards. One concept per card. Front: \
    vulnerability name. Back: what it is, how to identify it in code, how to fix it. If you \
    cannot explain the fix without looking, you do not own the concept."""

[[block]]
kind = "bullet"
text = """\
    <b>For each lab:</b> write <a href=\"#lab_notes_format\" color=\"#3A7AB8\">lab notes</a> \
    for a lab that has none. When a lab that already has notes is assigned again, update \
    them if the repeat exposed a gap."""

[[block]]
kind = "bullet"
text = "<b>Material in Phases II–V gets full note cards.</b>"

[[block]]
kind = "space"
points = 2

[[block]]
kind = "subheading"
title = "Portfolio: Writeups & Project Site"

[[block]]
kind = "paragraph"
text = """\
    AppSec portfolios are built differently from software engineering portfolios. They \
    center on documented offensive work: vulnerability writeups, lab solutions, \
    capture-the-flag (CTF) walkthroughs, threat model documents, and additional artifacts. A \
    writeup shows someone finding a vulnerability, understanding why it exists, exploiting \
    it, and explaining the fix."""
style = "body"

[[block]]
kind = "bullet"
text = """\
    <b>Writeup format:</b> every writeup uses the write-up structure from <a \
    href=\"https://tryhackme.com/room/writingpentestreports\" color=\"#3A7AB8\">Writing \
    Pentest Reports</a>. The GitHub version follows this structure; the LinkedIn version can \
    be a narrative rewrite of it (800–1,200 words)."""

[[block]]
kind = "bullet"
text = """\
    <b>Target:</b> the writeups scheduled in Phases I–III, then the Juice Shop assessment \
    report and the threat model. Quality over quantity."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://github.com/KLabWeb\" color=\"#3A7AB8\">GitHub</a>:</b> Commit from \
    Day 1 — the very first commit is this study plan and its build script. Keep everything \
    in public repositories — the plan, notes, tooling-phase scripts, custom Semgrep rules, \
    automation tools, and lab artifacts. Every README explains the methodology and what the \
    artifact demonstrates — not just usage instructions."""

# ════════════════════════════════════════════════════════════════════════
#  PITFALLS & RISK ASSESSMENT
# ════════════════════════════════════════════════════════════════════════
[[block]]
kind = "page_break"

[[block]]
kind = "heading"
title = "AppSec: Potential Pitfalls & Risk Assessment"

[[block]]
kind = "concept"
name = "AI Replacing AppSec Engineers — Real but Limited"
text = """\
    AI-assisted SAST tools (GitHub Copilot Autofix, Snyk Code, Semgrep with AI triage) are \
    improving and will automate more routine vulnerability scanning over time. The roles \
    being automated are the routine scan-and-report functions, not the manual code review, \
    threat modeling, and developer consultation that AppSec engineers do. The plan spends \
    its time on that manual work."""

[[block]]
kind = "concept"
name = "Certifications Are Not the Portfolio"
text = """\
    Sec+ is a recognized baseline credential in enterprise and regulated hiring. Postings \
    that require it are often cleared or defence-contractor roles, so the plan schedules it \
    only if that work is chosen, and treats the portfolio as the evidence of skill."""

[[block]]
kind = "concept"
name = "Moderate Philly Market"
text = """\
    Philadelphia’s AppSec market is real but not as deep as New York, DC, or San Francisco. \
    The mitigation is remote — a large share of AppSec postings offer remote or hybrid. \
    Philadelphia is a base, not a constraint."""

[[block]]
kind = "concept"
name = "Scope Creep into Red Team"
text = """\
    AppSec engineers frequently perform application-level penetration testing as part of the \
    role — Burp Suite, manual web app testing, OWASP methodology. This is expected and built \
    into the plan. The drift to avoid is into full red team or network penetration testing, \
    which is a distinct specialization requiring different skills (Active Directory, network \
    exploitation, infrastructure pivoting)."""

[[block]]
kind = "space"
points = 4

[[block]]
kind = "note"
text = """\
    <b>Net assessment:</b> The risks are real. They do not negate the market opportunity. \
    The plan as designed — hands-on lab work over certifications, manual security skill over \
    automated tooling familiarity, full-stack deployment capability — is structured to be \
    resilient to the downside scenarios above."""

# ----- STUDY PLAN PHASE SUMMARY -----
[[block]]
kind = "page_break"

[[block]]
kind = "heading"
title = "Study Plan Phase Summary"

[[block]]
kind = "space"
points = 4

[[block]]
kind = "paragraph"
text = """\
    This plan turns a working software engineer into an application security engineer with \
    DevSecOps depth over eight to nine months. Rather than front-loading theory, it follows \
    a deliberate arc: start with engineering projects, practice offense early, then build \
    depth and professional tooling on top of that foundation."""
style = "body"

[[block]]
kind = "space"
points = 6

[[block]]
kind = "paragraph"
text = """\
    It opens with engineering projects: Python and FastAPI, HTTP, Docker, a working local \
    lab (Phase 0). Phase I follows with an introduction to the attacker mindset, so security \
    work is hands-on from the start. Phase II then covers web and network foundations at \
    security depth."""
style = "body"

[[block]]
kind = "space"
points = 6

[[block]]
kind = "paragraph"
text = """\
    The middle of the plan builds the offensive skill set: going deep on the core \
    vulnerability classes — injection, XSS, broken authentication and access control, \
    server-side request forgery (SSRF), and the rest — by exploiting each one hands-on in \
    deliberately vulnerable labs (Phase III), then layering on the professional toolchain \
    (Burp Suite, plus SAST, DAST, dependency and secrets scanning) and earning the Burp \
    Suite Certified Practitioner certification, a hands-on web-exploitation credential \
    (Phase IV). A thread of AI and large language model (LLM) security — prompt injection, \
    output handling, tool-calling risk — runs through these phases as well."""
style = "body"

[[block]]
kind = "space"
points = 6

[[block]]
kind = "paragraph"
text = """\
    The back half pivots toward the work an AppSec engineer actually does day to day — cloud \
    security basics (Phase V) and secure code review and threat modeling (Phase VI) — \
    rounded out by CompTIA Security+ only if cleared or defence-contractor work is chosen \
    (Phase VII)."""
style = "body"

[[block]]
kind = "space"
points = 6

[[block]]
kind = "paragraph"
text = """\
    It closes with focused interview preparation (Phase VIII) and the expected first days on \
    the job (Phase IX). Applications begin in Phase VIII, after the line of ready."""
style = "body"

