[[block]]
kind = "paragraph"
text = """\
    Phase IV moves from knowing vulnerability classes to operating the professional \
    toolchain used to find them systematically. Burp Suite is used throughout the phase. \
    SAST (static analysis of source code, via Semgrep) and DAST (dynamic testing of the \
    running app) are the automation layer. The phase builds tool fluency: Burp Suite finds \
    vulnerabilities faster once the classes from Phase III are understood. Its dependency \
    scanning step produces a write-up of the Phase 0 FastAPI application’s supply chain, \
    labelled with its OWASP Top 10 category, A03 Software Supply Chain Failures. The phase \
    also covers the BSCP exam topics that earlier phases did not, including HTTP request \
    smuggling, Host header attacks, and web cache poisoning."""
style = "body"

