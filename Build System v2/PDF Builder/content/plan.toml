[[block]]
kind = "concept"
name = "Burp Suite as an extension of manual thinking"
text = """\
    Burp Suite intercepts, replays, and scans HTTP traffic, among other functions. Its \
    manual tools do not find vulnerabilities on their own — they make manual exploitation \
    efficient. Understanding of what to look for drives the tool, not the reverse. <b>On the \
    job:</b> Web pentest engagements commonly run through Burp Suite or an equivalent proxy. \
    It shows what a web application sends and receives. The AppSec engineer’s equivalent of \
    a developer’s debugger."""

[[block]]
kind = "concept"
name = "SAST vs. DAST vs. SCA vs. Secrets Scanning"
text = """\
    Four distinct scanning approaches that catch different vulnerability classes. SAST reads \
    code, misses runtime behavior. DAST tests a running app, misses code paths not \
    exercised. SCA finds known CVEs in dependencies. Secrets scanning finds exposed \
    credentials in code and history. A mature AppSec program typically uses all four — plus \
    Python-specific tools like Bandit for Python shops. <b>On the job:</b> Integrating \
    Semgrep into a company’s CI/CD pipeline, writing rules for company-specific \
    vulnerability patterns, and triaging results is a common AppSec responsibility. The \
    custom rule you built is the portfolio demonstration."""

[[block]]
kind = "concept"
name = "False positive triage"
text = """\
    Automated tools have noise. Distinguishing real findings from false positives without \
    dismissing everything is where security judgment matters more than tool knowledge."""

[[block]]
kind = "concept"
name = "Professional vulnerability reporting"
text = """\
    Severity rating (CVSS), evidence documentation, clear remediation guidance. The output \
    of AppSec work is a finding that a developer can act on — not just a list of things that \
    are broken. <b>On the job:</b> An engagement ends in a report. The format you learned in \
    the Juice Shop assessment is a format used in production. Clear findings, actionable \
    remediations, evidence-backed."""

[[block]]
kind = "concept"
name = "Secrets management"
text = """\
    Hardcoded credentials are a separate vulnerability class from application logic flaws. \
    The fix is not deletion from current code — it is rotation of the exposed credential \
    plus integration of a secret manager (HashiCorp Vault, AWS Secrets Manager) and \
    pre-commit scanning to prevent recurrence. <b>On the job:</b> Gitleaks runs as a \
    pre-commit hook and a CI gate. TruffleHog runs on a schedule against full git history. \
    When a developer accidentally commits an API key, you have a runbook: alert the \
    developer, rotate the credential immediately (assume it is already compromised), add the \
    pattern to the blocklist. This is day-one operational work at many companies."""

