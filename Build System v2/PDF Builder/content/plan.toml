[[block]]
kind = "paragraph"
text = """\
    The major vulnerability classes live inside HTTP, authentication protocols, browser \
    security models, or API design patterns. The phase reframes these layers from an \
    adversarial perspective — not just how they work, but why they fail. Its audit of the \
    Phase 0 FastAPI application produces write-ups labelled with the OWASP Top 10, OWASP’s \
    standard awareness document of the most critical security risks to web applications. It \
    closes with the defender’s view of AppSec (Alice and Bob) and cryptography fundamentals."""
style = "body"

