        Flask, or FastAPI) from GitHub. Scope it to one subsystem, for example \
        authentication and session handling, roughly 2,000 lines, and budget about 8 hours""",
    """\
        <b>Apply the systematic methodology:</b> trace user input, verify authentication, \
        check authorization, audit crypto, check dependencies""",
]

[[block]]
kind = "step"
number = "02"
label = "READ + PROJECT: Threat Modeling"
time = "Weeks 26–28"
