[[block]]
kind = "space"
points = 8

[[block]]
kind = "subheading"
title = "<a name=\"application_strategy\"/>Application Strategy"

[[block]]
kind = "bullet"
text = """\
    <b>Start applying in Phase IV:</b> BSCP preparation is under way, and the writeups from \
    Phases I–III are published."""

[[block]]
kind = "bullet"
text = """\
    <b>Target titles:</b> Application Security Engineer, Security Engineer I or II, Product \
    Security Engineer, DevSecOps Engineer, and additional related titles. Five years of \
    production development plus this portfolio is relevant experience for postings that ask \
    for security experience."""

[[block]]
kind = "bullet"
text = """\
    <b>Pin your AppSec work:</b> set your <a href=\"https://github.com/KLabWeb\" \
    color=\"#3A7AB8\">GitHub</a> pinned repositories to the key new artifacts — the <a \
    href=\"#art_juiceshop\" color=\"#3A7AB8\">Juice Shop assessment report</a>, your <a \
    href=\"#art_semgrep\" color=\"#3A7AB8\">custom Semgrep rule</a>, and the <a \
    href=\"#art_threatmodel\" color=\"#3A7AB8\">threat model</a>."""

[[block]]
kind = "bullet"
text = """\
    <b>Make <a href=\"https://www.linkedin.com\" color=\"#3A7AB8\">LinkedIn</a> \
    application-ready:</b> list BSCP and Security+ under licenses and certifications as each \
    is passed; link your portfolio projects and published write-ups; and state the move into \
    application security in the About section. Publish as you work through the plan."""

[[block]]
kind = "bullet"
text = """\
    <b>Cover letters and interviews:</b> lead with five years of full-stack software \
    engineering, then the move into application security. Point to this plan and portfolio \
    as the evidence."""

[[block]]
kind = "space"
points = 8

[[block]]
kind = "subheading"
title = "<a name=\"lab_notes_format\"/>Lab Notes Format"

[[block]]
kind = "paragraph"
text = """\
    Lab notes record how a lab was solved, so the method can be recalled later without \
    solving the lab again."""
style = "body"

[[block]]
kind = "bullet"
text = """\
    <b>When to write them:</b> write lab notes for a lab that has none. When a later step \
    assigns a lab that already has notes, update them if the repeat exposed a gap."""

[[block]]
kind = "bullet"
text = "<b>Title:</b> the lab’s title and URL."

[[block]]
kind = "bullet"
text = """\
    <b>Recognition:</b> what in the application’s behavior showed that the vulnerability was \
    present."""

[[block]]
kind = "bullet"
text = "<b>Exploit:</b> the working payload or request sequence."

[[block]]
kind = "bullet"
text = "<b>Root cause:</b> why the application was exploitable."

[[block]]
kind = "bullet"
text = "<b>Fix:</b> the change to the code or configuration that removes the vulnerability."

[[block]]
kind = "bullet"
text = """\
    <b>Where to keep them:</b> one searchable file, grouped by vulnerability class. In Phase \
    IV this file becomes a reference for the BSCP exam."""

# ════════════════════════════════════════════════════════════════════════
#  PHILADELPHIA APPSEC COMMUNITY  (subsection of the Appendix)
# ════════════════════════════════════════════════════════════════════════
[[block]]
kind = "page_break"

[[block]]
kind = "paragraph"
text = "<a name=\"philly_appsec\"/>Philadelphia AppSec Community"
style = "subsection_heading"

[[block]]
kind = "rule"

[[block]]
kind = "paragraph"
text = """\
    Security networking operates differently from general tech networking. The community is \
    smaller and more tight-knit. Attending events builds relationships with local \
    practitioners. Show up, ask good questions, and bring something to demonstrate."""
style = "body"

[[block]]
kind = "space"
points = 4

[[block]]
kind = "paragraph"
text = "<b>Core Groups</b>"
style = "body"

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://owasp.org/chapters/philadelphia\" color=\"#3A7AB8\">OWASP \
    Philadelphia Chapter</a></b> (events on <a \
    href=\"https://meetup.com/owasp-philadelphia-chapter\" color=\"#3A7AB8\">Meetup</a> · \
    Free) — An AppSec-specific group in Philadelphia. OWASP (Open Web Application Security \
    Project) is a nonprofit foundation for web application security. The Philadelphia \
    chapter holds regular meetings with technical presentations on vulnerability classes, \
    tooling, and real-world AppSec work. The people in this room are AppSec practitioners at \
    companies across the region."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://dc215.org\" color=\"#3A7AB8\">DC215: Philadelphia DEF CON \
    Group</a></b> (events on <a href=\"https://meetup.com/dc_215\" \
    color=\"#3A7AB8\">Meetup</a> · Free) — DEF CON Groups are local offshoots of DEF CON, an \
    annual hacker conference. DC215 holds regular meetups with technical talks, CTF \
    practice, and informal knowledge sharing. The format rewards people who bring something \
    to show."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://bsidesphilly.org\" color=\"#3A7AB8\">BSides Philadelphia</a></b> \
    (Annual · December 11, 2026 · $80 early bird) — Community-organized security conference \
    with talks across offensive, defensive, and AppSec tracks. Affordable, full-day, \
    attended by local practitioners. Volunteer if possible."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://philly2600.net\" color=\"#3A7AB8\">Philly 2600</a></b> (First \
    Friday monthly · Free) — Philadelphia’s longest-running hacker meetup — running since \
    the early 1990s and one of the first 2600 meetings listed in 2600 Magazine. Meets the \
    first Friday of every month at Iffy Books starting at 6pm. No set agenda, no \
    presentations, no gatekeeping — a casual hangout where people bring things to hack on or \
    show off. Open to anyone. Around 8pm the group typically moves to a nearby bar. A good \
    place to show up early in the plan."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://x.com/phillysec\" color=\"#3A7AB8\">PhillySec</a></b> (Second \
    Wednesday monthly · Free) — Monthly security meetup, second Wednesday of each month. \
    More structured than Philly 2600 — presentations and technical discussions rather than \
    open hangout format. A good mid-plan target."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://meetup.com/owasp-delaware-chapter\" color=\"#3A7AB8\">OWASP \
    Delaware Chapter</a></b> (Wilmington, DE · Monthly · Free) — The OWASP chapter an hour \
    south. Runs a monthly MetaCTF flash CTF night, hands-on exercises, and secure-coding \
    presentations. A second AppSec-specific room when the Philadelphia calendar is quiet."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://exmachinaparlor.org\" color=\"#3A7AB8\">Ex Machina Parlor</a></b> \
    (319 N 11th St, Room 5D · Philadelphia) — A hackerspace specifically aimed at people \
    interested in cybersecurity. Workshop and collaborative hacking space rather than a \
    meetup. Worth knowing it exists as a physical space to work alongside practitioners. \
    Check their calendar for events and open nights."""

[[block]]
kind = "space"
points = 2

[[block]]
kind = "space"
points = 4

[[block]]
kind = "paragraph"
text = "<b>Conferences</b>"
style = "body"

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://owasp.org/events\" color=\"#3A7AB8\">OWASP Global AppSec \
    USA</a></b> (2026: November 2 to 6, San Francisco) — OWASP's largest US conference. This \
    conference matches this plan closely: the audience is AppSec practitioners and the talks \
    map to the skills in this plan. Attend once Phase IV or V is complete."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://basconf.org\" color=\"#3A7AB8\">OWASP BASC (Boston)</a></b> (2027: \
    Saturday, April 3, one day, Cambridge, MA) — The OWASP Boston Application Security \
    Conference. Regional, focused on AppSec engineering and secure development. Lower-cost \
    than Global AppSec USA. Strong emphasis on hands-on content and OWASP standards — the \
    audience overlaps heavily with who you will work alongside in the role."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://thotcon.org\" color=\"#3A7AB8\">Thotcon (Chicago)</a></b> (next \
    event June 11–12, 2027) — A mid-sized hacker conference: more intimate than DEF CON, \
    technically dense, practitioner-focused."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://jawncon.org\" color=\"#3A7AB8\">JawnCon (Glenside, PA)</a></b> \
    (Annual · October) — Philadelphia’s own security and technology conference, held at \
    Arcadia University just outside the city. Covers a wide range of security and tech \
    topics with a deliberately approachable, community feel. Worth attending as a local \
    conference where you will run into the same practitioners from OWASP and DC215."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://bsidesdelaware.com\" color=\"#3A7AB8\">BSides Delaware (Newark, \
    DE)</a></b> (Annual · November 13–14, 2026 · $25) — The nearest BSides after \
    Philadelphia, at the University of Delaware, about an hour away. Talks, villages, and a \
    CFP; the same regional practitioner crowd as BSides Philly."""

[[block]]
kind = "bullet"
text = """\
    <b><a href=\"https://defcon.org\" color=\"#3A7AB8\">DEF CON (Las Vegas)</a></b> (Annual \
    · August) — An annual hacker conference. Within it, the <a \
    href=\"https://appsecvillage.com\" color=\"#3A7AB8\">AppSec Village</a> is a 100% \
    volunteer-run space specifically for application security — attacker-minded talks, live \
    demos, hands-on workshops, and an AppSec-focused CTF. A larger, costlier trip than the \
    regional events."""
