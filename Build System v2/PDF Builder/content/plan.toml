        href=\"https://docs.python.org/3/howto/logging.html#basic-logging-tutorial\" \
        color=\"#3A7AB8\">Basic Logging Tutorial</a> of the Python documentation. Then, add \
        logging of authentication and authorization events to the application, plus add the \
        fixed code to the write-up""",
    """\
        Give remediation advice (no code) for a finding that cannot be fixed inside the \
        application""",
    "Fix only these findings. The application’s other deliberate weaknesses stay in place",
]

