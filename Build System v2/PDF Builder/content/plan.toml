    """\
        Read “<a href=\"https://www.getcertifiedgetahead.com/\" color=\"#3A7AB8\"><i>CompTIA \
        Security+ Get Certified Get Ahead: SY0-701 Study Guide</i></a>” cover to cover. The \
        exam has five domains: General Security Concepts, \
        Threats/Vulnerabilities/Mitigations, Security Architecture, Security Operations, and \
        Security Program Management & Oversight""",
    """\
        Most technical content from the first three domains will be review from earlier \
        phases. Focus study time on the governance, compliance, and program management \
        domains""",
    """\
        <b>Full notes, then granular cards:</b> label and study note cards in book order — \
        one card per concept (title on the front, 1–5 bullets on the back), roughly 160–200 \
        cards, with extra cards where a topic is dense.""",
    """\
        Prioritize the high-yield memorization sets: ports and protocols, cryptography and \
        PKI, attack types, security control types, and the governance, compliance, and \
        framework material""",
    """\
        <b>Memorize (grouped spaced review):</b> memorize cards in groups of seven with full \
        front-to-back recall, fold each group into a growing cumulative review pile, and \
        re-drill the whole pile each time you add a new memorized 7 card group to it \
        (pruning only over-learned cards). Budget real time — at ~180 cards this is a \
        multi-day make-and-memorize effort, not an afterthought""",
]

