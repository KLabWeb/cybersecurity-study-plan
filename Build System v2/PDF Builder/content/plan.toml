        href=\"https://securitylab.github.com/advisories/GHSL-2025-030_GHSL-2025-032_AWS_SAM_CLI/\" \
        color=\"#3A7AB8\">Path traversal in AWS SAM CLI</a>[[li]]<a \
        href=\"https://securitylab.github.com/advisories/GHSL-2023-232_GHSL-2023-234_Flowise/\" \
        color=\"#3A7AB8\">Path injection, Cross-Site Scripting (XSS) and CORS \
        misconfiguration in Flowise</a>[[li]]<a \
        href=\"https://securitylab.github.com/advisories/GHSL-2025-045_GHSL-2025-048_RVC-Boss_GPT-SoVITS/\" \
        color=\"#3A7AB8\">Command injection in GPT-SoVITS</a>[[li]]<a \
        href=\"https://securitylab.github.com/advisories/GHSL-2025-023_binance-trading-bot/\" \
        color=\"#3A7AB8\">Authenticated RCE in binance-trading-bot via command \
        injection</a>[[li]]<a \
        href=\"https://securitylab.github.com/advisories/GHSL-2025-049_GHSL-2025-053_RVC-Boss_GPT-SoVITS/\" \
        color=\"#3A7AB8\">Remote Code Execution (RCE) in GPT-SoVITS</a>[[li]]<a \
        href=\"https://securitylab.github.com/advisories/GHSL-2025-117_GHSL-2025-118_Outline/\" \
        color=\"#3A7AB8\">Authorization Issues in Outline</a>[[li]]<a \
        href=\"https://securitylab.github.com/advisories/GHSL-2025-130_Sentry/\" \
        color=\"#3A7AB8\">Unauthorized access to event data across organizational boundaries \
        in Sentry</a>[[li]]<a \
        href=\"https://securitylab.github.com/advisories/GHSL-2026-004_GHSL-2026-005_Rocket_Chat/\" \
        color=\"#3A7AB8\">Authentication bypass in Rocket.Chat</a>[[li]]<a \
        href=\"https://securitylab.github.com/advisories/GHSL-2023-161_GHSL-2023-162_Home_Assistant/\" \
        color=\"#3A7AB8\">Client-Side Request Forgery (CSRF) in the Home Assistant Companion \
        for iOS and macOS</a>""",
    """\
        When the list is finished and the job search is still running, continue at the same \
        rate with write-ups whose titles name a web vulnerability class from Phase III.""",
    """\
        Practice naming the vulnerability class immediately from a code sample — for \
        example: user input passed into a query without sanitizing it (injection); a React \
        component using dangerouslySetInnerHTML (cross-site scripting); a JSON Web Token \
        whose signature algorithm is accepted as ‘none’ (authentication bypass); a user \
        identifier read from a request parameter with no authorization check (insecure \
        direct object reference); or a URL fetched by the server without validation \
        (server-side request forgery).""",
]

[[block]]
kind = "step"
number = "05"
label = "PRACTICE: Light Scripting & System Design"
time = "Weeks 33–36"
bullets = [
    """\
        Practice short Python scripting without IDE hints; some companies include a short \
        coding session (ex. CoderPad): a small script to parse a log, fix a function, or \
        automate a check. <a href=\"https://nostarch.com/impracticalpythonprojects\" \
        color=\"#3A7AB8\"><i>Impractical Python Projects</i></a> is good practice.""",
    """\
        Practice the security system-design format: sketch a small architecture — for \
        example the trust boundaries of an authentication flow or a microservice — mark \
        where data crosses each trust boundary, apply the STRIDE model to enumerate the \
        threats, and rehearse walking through it aloud. This is verbal whiteboard practice, \
        not a written deliverable.""",
]

[[block]]
kind = "step"
number = "06"
label = "PRACTICE: Mock Interviews"
time = "Weeks 33–36"
bullets = [
    """\
        Run at least one full mock interview each week, covering behavioral questions and a \
        code review, through <a href=\"https://www.tryexponent.com/\" color=\"#3A7AB8\">Aced \
        (formerly Exponent)</a> (<a \
        href=\"https://www.tryexponent.com/courses?query=security%20engineering\" \
        color=\"#3A7AB8\">its security engineering courses</a>) or <a \
        href=\"https://interviewing.io/\" color=\"#3A7AB8\">interviewing.io</a>.""",
    """\
        Build up on your own first — untimed, then timed, then recorded and reviewed against \
        your own answers — before booking the weekly mock interviews above.""",
    """\
        When you do not immediately know an answer, narrate your reasoning aloud and state \
        what you do know and how you would investigate it.""",
    """\
        Prepare for the formats that published application security interview loops often \
        use: code review, threat modeling and design conversation. Those loops rarely \
        contain algorithm puzzle rounds, so none is practised here""",
]

# ════════════════════════════════════════════════════════════════════════
#  PHASE IX — EXPECTED FIRST DAYS ON THE JOB
# ════════════════════════════════════════════════════════════════════════
[[block]]
kind = "page_break"

[[block]]
kind = "banner"
numeral = "IX"
title = "Expected First Days on the Job"
duration = "Week 37+"

[[block]]
kind = "space"
points = 6

[[block]]
kind = "paragraph"
text = """\
    The first weeks in a new role go to internal tooling, company-specific security \
    policies, and how the development teams work."""
style = "body"

[[block]]
kind = "space"
points = 2

[[block]]
kind = "subheading"
title = "First Two Weeks"

[[block]]
kind = "paragraph"
text = """\
    Read the existing security documentation the way you read a codebase — understand what \
    is there before suggesting what should change. Ask about the current vulnerability \
    backlog before proposing new tooling. Understand what development teams build and how \
    they ship."""
style = "body"

[[block]]
kind = "bullet"
text = "What is the current SAST setup, if any? What do developers receive as output?"

[[block]]
kind = "bullet"
text = "What does the existing pentest methodology look like? How are findings tracked?"

[[block]]
kind = "bullet"
text = "Who are the key development team contacts? What are their current security concerns?"

[[block]]
kind = "bullet"
text = "What does the incident response process look like? Has it been tested?"

[[block]]
kind = "space"
points = 4

[[block]]
kind = "note"
text = """\
    The first-week question is not what to add but what is already here and why it is the \
    way it is. The answer shows the organizational constraints you are working within."""

[[block]]
kind = "space"
points = 6

[[block]]
kind = "subheading"
title = "What You Bring on Day One"

[[block]]
kind = "concept"
name = "Developer empathy"
text = """\
    You understand how vulnerable patterns get written, from years of shipping software. \
    That shared experience makes conversations with development teams direct and credible."""

[[block]]
kind = "concept"
name = "API security depth"
text = """\
    REST API security is a central AppSec domain. Years of building REST APIs, plus the API \
    security work in this plan, carry over directly."""

[[block]]
kind = "concept"
name = "Automation instinct"
text = """\
    Semgrep rule development, CI/CD integration, and tooling scripting reuse skills from \
    engineering work."""

[[block]]
kind = "concept"
name = "Full-stack deployment"
text = """\
    You can handle the end-to-end deployment of security tooling: writing the Semgrep rule, \
    integrating it into GitHub Actions, and triaging the results."""

