        href=\"https://securitylab.github.com/advisories/GHSL-2023-200_FarmBot_Web_App/\" \
        color=\"#3A7AB8\">SQL injection vulnerability in FarmBot’s web app</a>[[li]]<a \
        href=\"https://securitylab.github.com/advisories/GHSL-2024-090_yt-dlp/\" \
        color=\"#3A7AB8\">Path traversal in yt-dlp leading to RCE</a>[[li]]<a \
