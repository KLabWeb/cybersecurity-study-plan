[[block]]
kind = "subheading"
title = "Concepts and Their Use on the Job"

[[block]]
kind = "concept"
name = "Secure code review as methodology"
text = """\
    Systematic input tracing, authentication verification, authorization checking, \
    cryptography auditing. Replicable and teachable. <b>On the job:</b> When a developer \
    asks you to review a PR, you apply the methodology: trace inputs, check auth, check \
    authz, check crypto, check dependencies. Faster and repeatable when systematic."""

[[block]]
kind = "concept"
name = "OWASP ASVS as a verification framework"
text = """\
    ~350 testable security requirements organized by domain. Level 1 is the first layer of \
    defense against common attacks. Level 2 is a comprehensive view of standard security \
    practice. Using ASVS during code review means you can say ‘this fails ASVS V2.1.1’ \
    rather than ‘this seems wrong’ — a finding a developer can look up and act on."""

[[block]]
kind = "concept"
name = "STRIDE threat modeling"
text = """\
    Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation \
    of Privilege. A threat category for every component of a data flow diagram. <b>On the \
    job:</b> When a team presents a new microservice design, you build a DFD on the \
    whiteboard, identify trust boundaries, and run STRIDE. One threat model at design time \
    can prevent many vulnerability findings after code is written."""

[[block]]
kind = "concept"
name = "Trust boundaries"
text = """\
    The lines in a DFD where data crosses from less-trusted to more-trusted context. A trust \
    boundary is a potential vulnerability surface."""

[[block]]
kind = "concept"
name = "Time-pressured code review"
text = """\
    Cold code, 30–45 minutes, a written or spoken identification of the flaw. The same \
    format as a PR review under deadline."""

