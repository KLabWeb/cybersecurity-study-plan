# ════════════════════════════════════════════════════════════════════════
#  WHAT IS APPLICATION SECURITY?
# ════════════════════════════════════════════════════════════════════════
[[block]]
kind = "page_break"

[[block]]
kind = "heading"
title = "What Is Application Security?"

[[block]]
kind = "paragraph"
text = """\
    Application security — AppSec — is the discipline of finding, fixing, and preventing \
    security vulnerabilities in software. Where most of software engineering asks <i>does \
    this work?</i>, application security asks <i>can this be broken?</i>"""
style = "body"

[[block]]
kind = "space"
points = 2

[[block]]
kind = "paragraph"
text = """\
    Software has an attack surface: input fields, API endpoints, authentication flows and \
    dependencies are potential entry points for an adversary. AppSec engineers \
    systematically map that surface, probe it for weaknesses, and work with development \
    teams to close them — before attackers find them first."""
style = "body"

[[block]]
kind = "space"
points = 2

[[block]]
kind = "paragraph"
text = """\
    The discipline spans the entire software development lifecycle. In the design phase, it \
    means threat modeling — drawing data flows and asking what happens when an attacker \
    controls each input. During development, it means secure code review — reading code the \
    way an attacker reads it, looking for injection points, broken authentication, insecure \
    data handling. In testing, it means static analysis (SAST) that reads source code for \
    vulnerability patterns, dynamic analysis (DAST) that probes a running application, and \
    manual penetration testing that combines both with adversarial creativity."""
style = "body"

[[block]]
kind = "space"
points = 2

[[block]]
kind = "paragraph"
text = """\
    The OWASP Top 10 is the field’s shared vocabulary for the most critical web application \
    security risks. SQL injection, broken access control, cross-site scripting, security \
    misconfigurations, software supply chain failures, and other key risks. These \
    vulnerabilities are not abstract academic concerns — they are the specific vulnerability \
    classes that appear in real breaches against real companies, year after year. AppSec \
    engineers treat them as a framework for understanding how systems fail, not as a list to \
    memorize."""
style = "body"

[[block]]
kind = "space"
points = 2

[[block]]
kind = "paragraph"
text = """\
    This plan targets web application security specifically — the attack surface that lives \
    at the HTTP layer, in APIs, in authentication flows, in the browser."""
style = "body"

[[block]]
kind = "space"
points = 2

# ════════════════════════════════════════════════════════════════════════
#  WHY APPSEC ENGINEERING
# ════════════════════════════════════════════════════════════════════════
[[block]]
kind = "page_break"

[[block]]
kind = "heading"
title = "Why AppSec Engineering"

[[block]]
kind = "subheading"
title = "The Case for This Path"

[[block]]
kind = "paragraph"
text = """\
    You spent five years building the attack surface that AppSec engineers protect. You know \
    FastAPI microservices, React frontends, AWS infrastructure, Docker containers, legacy \
    PHP codebases, and additional technologies that AppSec work asks you to reason about \
    adversarially."""
style = "body"

[[block]]
kind = "subheading"
title = "Your Structural Advantage"

[[block]]
kind = "paragraph"
text = """\
    AppSec engineers tend to come from development or from security. You come from \
    development, so you know how vulnerable patterns get written. The code patterns that \
    lead to SQL injection, authentication bypasses, and cross-origin resource sharing (CORS) \
    misconfigurations are patterns that developers encounter every day. This plan adds the \
    adversarial view of those same patterns."""
style = "body"

[[block]]
kind = "space"
points = 2

[[block]]
kind = "paragraph"
text = "Transferable skills:"
style = "body"

[[block]]
kind = "bullet"
text = "<b>FastAPI microservices</b> — REST API security is a core AppSec domain."

[[block]]
kind = "bullet"
text = """\
    <b>Python</b> — Production Python carries over to AppSec tooling: Semgrep rules, \
    scanning automation, and additional security utilities."""

[[block]]
kind = "bullet"
text = """\
    <b>React frontends</b> — Client-side vulnerabilities (XSS, cross-site request forgery \
    (CSRF), insecure storage) require understanding how the browser executes JavaScript. \
    React experience provides a strong foundation for understanding client-side \
    vulnerability patterns."""

[[block]]
kind = "bullet"
text = """\
    <b>AWS, Docker, Kubernetes</b> — Cloud and container security are AppSec-adjacent and \
    increasingly part of the role."""

[[block]]
kind = "bullet"
text = """\
    <b>Legacy PHP, raw SQL, and NoSQL</b> — You have worked in legacy PHP, MySQL, and \
    DynamoDB codebases, where SQL injection, insecure direct object reference (IDOR), and \
    NoSQL injection are commonly found."""

[[block]]
kind = "bullet"
text = """\
    <b>Architecture &amp; domain modeling</b> — You designed microservices and domain-driven \
    services with deliberate separation of concerns and trust boundaries. Threat modeling is \
    that same structural thinking turned toward attack: mapping data flows and asking where \
    trust is assumed."""

[[block]]
kind = "bullet"
text = """\
    <b>Testing discipline</b> — You wrote unit, integration, and regression tests. Security \
    testing builds on the same habits: defining inputs, expected behavior, and failure \
    modes."""

[[block]]
kind = "space"
points = 2

# ════════════════════════════════════════════════════════════════════════
#  WHY THIS MOMENT
# ════════════════════════════════════════════════════════════════════════
[[block]]
kind = "page_break"

[[block]]
kind = "heading"
title = "Why This Moment"

[[block]]
kind = "paragraph"
text = "The case for entering application security in 2026 rests on published data."
style = "body"

[[block]]
kind = "subheading"
title = "The breach problem is not going away."

[[block]]
kind = "paragraph"
text = """\
    <a \
    href=\"https://newsroom.ibm.com/2025-07-30-ibm-report-13-of-organizations-reported-breaches-of-ai-models-or-applications,-97-of-which-reported-lacking-proper-ai-access-controls\" \
    color=\"#3A7AB8\">IBM’s Cost of a Data Breach Report (2025 edition)</a> found that the \
    average U.S. cost of a data breach reached a record $10.22 million in 2025, even as the \
    global average fell slightly to $4.44 million driven by faster AI-assisted detection. \
    The U.S. number is the highest ever recorded. Nearly two-thirds of the 600 organizations \
    IBM studied said they were still recovering from their breach at the time of the report. \
    <a href=\"https://www.verizon.com/business/resources/reports/dbir/\" \
    color=\"#3A7AB8\">Verizon’s 2025 Data Breach Investigations Report</a> found that \
    exploitation of vulnerabilities — the class of attack that AppSec engineers specifically \
    exist to prevent — was present in 20% of all breaches studied; the 2026 edition reports \
    that vulnerability exploitation has overtaken stolen passwords as the leading way \
    attackers get in."""
style = "body"

[[block]]
kind = "subheading"
title = "The workforce gap is structural."

[[block]]
kind = "paragraph"
text = """\
    <a \
    href=\"https://www.isc2.org/Insights/2024/10/ISC2-2024-Cybersecurity-Workforce-Study\" \
    color=\"#3A7AB8\">ISC2’s 2024 Workforce Study</a> estimated a global cybersecurity \
    workforce gap of roughly 4.8 million people; <a \
    href=\"https://www.isc2.org/Insights/2025/12/2025-ISC2-Cybersecurity-Workforce-Study\" \
    color=\"#3A7AB8\">its 2025 study</a> published no gap estimate, reporting instead that \
    the shortage has moved from headcount to skills. <a \
    href=\"https://www.bls.gov/ooh/computer-and-information-technology/information-security-analysts.htm\" \
    color=\"#3A7AB8\">The U.S. Bureau of Labor Statistics</a> projects 21% job growth for \
    information security analysts from 2025 to 2035, much faster than the average for all \
    occupations, with about 14,100 openings a year. For application security specifically, \
    <a \
    href=\"https://www.mordorintelligence.com/industry-reports/application-security-market\" \
    color=\"#3A7AB8\">Mordor Intelligence</a> reports a 15% annual shortfall of AppSec \
    engineers in the United States through 2026, demand growing faster than the supply of \
    qualified people to fill it."""
style = "body"

[[block]]
kind = "paragraph"
text = """\
    The shortage is not evenly distributed. ISC2 noted in 2025 that skills shortages now \
    outweigh headcount shortages, so the shortage is in specific skills, not headcount. In \
    <a href=\"https://www.isc2.org/Insights/2025/07/2025-isc2-ai-pulse-survey\" \
    color=\"#3A7AB8\">ISC2’s 2025 AI Adoption Pulse Survey</a>, 52% of practitioners \
    expected AI to reduce the need for entry-level staff, because the time-consuming routine \
    tasks that once trained juniors are the ones AI takes first. What it does not take is \
    the judgment-intensive work: finding business logic flaws that automated scanners rarely \
    detect, threat modeling a new microservice architecture, explaining a critical finding \
    to a VP of Engineering in terms that result in a fix. That work requires a human who can \
    read code, understand systems, and think adversarially. That is the work this plan \
    prepares you for."""
style = "body"

[[block]]
kind = "subheading"
title = "The AppSec market is expanding fast."

[[block]]
kind = "paragraph"
text = """\
    <a href=\"https://straitsresearch.com/report/application-security-market\" \
    color=\"#3A7AB8\">Straits Research</a> values the global application security market at \
    $12.71 billion in 2025 and projects $42.29 billion by 2034, about 14% annual growth. \
    Static application security testing is its largest segment and grows at about 15% a \
    year. Application Security Engineer postings often list pay of about $120,000 to \
    $195,000 in the Philadelphia region, and about $143,000 to $200,000 nationally. Product \
    Security Engineer postings grew 12% year over year in 2024, seventh among the ten \
    fastest-growing security roles in <a \
    href=\"https://cybersn.com/blogs/the-cybersecurity-job-market\" \
    color=\"#3A7AB8\">CyberSN’s 2025 job-market analysis</a>."""
style = "body"

[[block]]
kind = "space"
points = 4

[[block]]
kind = "note"
text = """\
    <b>The structural argument:</b> <a \
    href=\"https://www-api.ibm.com/adobe/assets/urn:aaid:aem:607b9590-38e0-4c91-b433-aa8a17f5b5e8/original/as/cost-of-a-data-breach-2025-full-report.pdf\" \
    color=\"#3A7AB8\">IBM’s 2025 data</a> shows that organizations with a high security \
    skills shortage averaged $5.22 million in breach costs against $3.65 million for those \
    with little or none. Companies are not hiring AppSec engineers because it is a \
    nice-to-have. They are hiring because the cost of not having them is measurable, large, \
    and growing."""

# ════════════════════════════════════════════════════════════════════════
#  TARGET ROLE
# ════════════════════════════════════════════════════════════════════════
[[block]]
kind = "page_break"

[[block]]
kind = "heading"
title = "Target Role: Application Security Engineer"

[[block]]
kind = "subheading"
title = "What It Is — Conceptually"

[[block]]
kind = "paragraph"
text = """\
    Web application development and application security share the same foundation: HTTP, \
    APIs, authentication flows, browser security models, database queries. An endpoint is an \
    AppSec concern, an authentication flow is a potential bypass, and a React component that \
    renders user input is an XSS candidate. Developers who learn AppSec understand the \
    systems being defended — they are adding an adversarial lens to knowledge they already \
    hold."""
style = "body"

[[block]]
kind = "paragraph"
text = """\
    The shift is perspective. Where a developer asks <i>does this feature work \
    correctly?</i>, an AppSec engineer asks <i>what happens when an attacker controls this \
    input?</i> The underlying knowledge of the system is shared. The adversarial lens is the \
    discipline."""
style = "body"

[[block]]
kind = "subheading"
title = "What It Is — In Practice"

[[block]]
kind = "bullet"
text = """\
    <b>Secure code review</b> (builds on: pull request review) — Reading code to identify \
    vulnerability patterns: SQL queries built by string concatenation, tokens stored in \
    localStorage, endpoints missing authorization checks, user data rendered without \
    sanitization."""

[[block]]
kind = "bullet"
text = """\
    <b>Penetration testing / DAST</b> (builds on: integration testing) — Running Burp Suite \
    against a staging environment, intercepting HTTP requests, modifying parameters, \
    observing whether the application behaves securely."""

[[block]]
kind = "bullet"
text = """\
    <b>SAST tooling</b> (builds on: CI/CD linting and automation) — Integrating Semgrep into \
    the pipeline. Writing custom rules that catch company-specific vulnerability patterns. \
    Triaging scan results: true positives from false positives."""

[[block]]
kind = "bullet"
text = """\
    <b>Threat modeling</b> (builds on: architecture review) — Given a proposed system \
    design, enumerate the ways it could be attacked. STRIDE: Spoofing, Tampering, \
    Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege."""

[[block]]
kind = "bullet"
text = """\
    <b>Vulnerability management</b> (builds on: bug triage) — Prioritizing findings by \
    severity and business impact. Writing clear reports developers can act on. Tracking \
    remediation. Verifying fixes."""

[[block]]
kind = "space"
points = 2

[[block]]
kind = "subheading"
title = "Day-to-Day Responsibilities"

[[block]]
kind = "bullet"
text = """\
    Secure code review on high-risk PRs and new features — auth, payments, file upload, API \
    endpoints"""

[[block]]
kind = "bullet"
text = """\
    Running and maintaining SAST tooling in CI/CD — Semgrep rules, false positive triage, \
    new rule development"""

[[block]]
kind = "bullet"
text = """\
    Manual penetration testing of web applications and APIs — Burp Suite, \
    methodology-driven, OWASP-aligned"""

[[block]]
kind = "bullet"
text = """\
    Threat modeling new system designs — STRIDE analysis, data flow diagrams, risk \
    documentation"""

[[block]]
kind = "bullet"
text = """\
    Vulnerability reporting and remediation tracking — clear writeups, severity ratings, \
    developer liaison"""

[[block]]
kind = "bullet"
text = """\
    Security training and developer education — lunch-and-learns, secure coding guidelines, \
    champions programs"""

[[block]]
kind = "bullet"
text = """\
    Dependency and supply chain security — software composition analysis (SCA) scanning, CVE \
    monitoring, patch prioritization"""

[[block]]
kind = "space"
points = 4

[[block]]
kind = "subheading"
title = "Philadelphia & Remote Market"

[[block]]
kind = "paragraph"
text = """\
    AppSec has strong remote availability — a large share of postings offer remote or hybrid \
    flexibility. Local Philly demand is moderate but real, anchored by healthcare, financial \
    services, and enterprise tech."""
style = "body"

[[block]]
kind = "space"
points = 2

